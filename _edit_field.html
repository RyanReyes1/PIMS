<!--
Parent: _patient_data_section.html
Children: None

Template for the individual data field edit form for a patient's data form
Appears when the user clicks the edit button for a data field on an individual patient's data form
The user edits the text data for the data field (except for the restricted access field, where the checkbox is checked/enchecked), then pressess submit to change the data

Components:
*Data edit field: Nature changes based on the data fields nature (checkbox for restricted visitation, else textbox)
*Submit button: Submits the new data and changes the data field's data
*Cancel button: Get the previous display data and place it back into the patient data form
-->
<div id="patient-{{ patient_id }}-{{ field_name }}-display" class="bg-blue-50 p-4 rounded-lg shadow-sm">

    <!--Data field edit form-->
    <form hx-post="{{ url_for('update_patient_section', patient_id=patient_id, field_name=field_name) }}"
          hx-target="#patient-{{ patient_id }}-{{ field_name }}-display"
          hx-swap="outerHTML">
        <h4 class="text-sm font-medium text-blue-700">{{ field_name.replace('_', ' ').title() }}:</h4>
        <!--Data edit field-->
        {% if current_value is boolean %}
            <!--Checkbox-->
            <div class="flex items-center mt-1">
                <input type="checkbox" id="edit-{{ field_name }}" name="edit-{{ field_name }}"
                       {% if current_value %}checked{% endif %}
                       class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                <label for="edit-{{ field_name }}" class="ml-2 block text-sm text-gray-900">
                    {{ 'Yes' if current_value else 'No' }}
                </label>
            </div>
        {% else %}
            <!--Textbox-->
            <input type="text" id="edit-{{ field_name }}" name="edit-{{ field_name }}"
                   value="{{ current_value }}"
                   class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        {% endif %}
        <div class="flex space-x-2 mt-3">
            <!--Submit button-->
            <button type="submit" class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-md">Save</button>
            <!--Cancel button-->
            <button type="button" class="px-3 py-1 bg-gray-400 hover:bg-gray-500 text-white text-sm rounded-md"
                    hx-get="{{ url_for('update_patient_section', patient_id=patient_id, field_name=field_name) }}"
                    hx-target="#patient-{{ patient_id }}-{{ field_name }}-display"
                    hx-swap="outerHTML"> {# Re-fetch the original display state #}
                Cancel
            </button>
        </div>
    </form>
</div>
