<!--
Parent: 
Children: 

Template for the tab header for a patient information tab
Functions like a button, and displays the patient's name for quick and easy identification
When clicked, displays the patient's information form

Components:
*Tab header: Displays a patient's information form
-->
<button
    id="tab-header-{{ patient.id }}"
    class="px-4 py-2 text-sm font-medium border-t border-r border-l rounded-t-md bg-gray-200 text-gray-700 hover:bg-gray-300 focus:outline-none focus:z-10 focus:border-blue-500 focus:ring-2 focus:ring-blue-500"
    onclick="
        document.querySelectorAll('#patient-tab-content-area > div').forEach(div => div.classList.add('hidden'));
        document.getElementById('patient-tab-{{ patient.id }}').classList.remove('hidden');
        document.querySelectorAll('#patient-tab-headers > button').forEach(btn => {
            btn.classList.remove('bg-white', 'border-b-0', 'text-gray-900', 'hover:bg-gray-100');
            btn.classList.add('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
        });
        this.classList.add('bg-white', 'border-b-0', 'text-gray-900', 'hover:bg-gray-100');
        this.classList.remove('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
    "
    aria-controls="patient-tab-{{ patient.id }}"
    role="tab"
>
    {{ patient.name }}
</button>
