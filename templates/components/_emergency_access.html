<div class="p-6 bg-white rounded-lg shadow-md max-w-md mx-auto">
    <h2 class="text-2xl font-bold text-gray-800 mb-4">Request Emergency Access</h2>
    <form hx-post="{{ url_for('submit_emergency_access') }}" hx-target="#dynamic-content" hx-swap="innerHTML" class="space-y-4">
        <div>
            <label for="reason" class="block text-sm font-medium text-gray-700">Enter Reason:</label>
            <textarea id="reason" name="reason" rows="4" required
                      class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-500"></textarea>
        </div>
        <button type="submit" class="w-full px-4 py-3 bg-red-600 hover:bg-red-700 text-white rounded-md transition duration-200 ease-in-out font-semibold">
            Submit
        </button>
    </form>
</div>
