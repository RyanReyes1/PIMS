<!--
Parent: _patient_tab_officeworker.html, _patient_tab_volunteer.html
Children: None

Emergency access request form
Appears when the user clicks the emergency access button
The user enters their reason for requesting emergency access, then clicks submit to gain full physician-level access to that patient's data for this session

This is a modal/form component that displays in the #dynamic-content area.
Upon submission, it sends a POST request to /grant_emergency_access/{patient_id} which:
1. Logs the access request
2. Updates the session to track emergency access for this patient
3. Returns the physician-level patient tab view via OOB swap
4. Displays a success message

Components:
*Reason textarea: Text area where user explains why they need emergency access
*Cancel button: Closes the form without granting access
*Submit button: Submits the form and grants emergency access

Notes:
The form requires a patient_id parameter passed from the parent template.
The physician view is returned via hx-swap-oob="outerHTML:#patient-tab-{patient_id}"
-->
<div class="p-6 bg-white rounded-lg shadow-md border border-black max-w-md mx-auto">
    <h2 class="text-2xl font-bold text-gray-800 mb-4">Request Emergency Access</h2>

    <!--Emergency Access Request Form-->
    <form hx-post="{{ url_for('grant_emergency_access', patient_id=patient_id) }}" 
          hx-target="#dynamic-content" 
          hx-swap="innerHTML" 
          class="space-y-4">
        
        <!--Reason textarea-->
        <div>
            <label for="reason" class="block text-sm font-medium text-gray-700">Enter Reason:</label>
            <textarea id="reason" name="reason" rows="4" required
                      class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-500"
                      placeholder="Explain why you need access to this patient's full data"></textarea>
        </div>

        <!--Button group-->
        <div class="flex justify-end space-x-3 mt-6">
            <!--Cancel button-->
            <button type="button"
                    class="px-4 py-3 bg-gray-400 hover:bg-gray-500 text-white rounded-md transition duration-200 ease-in-out font-semibold"
                    hx-get="{{ url_for('clear_dynamic_content') }}"
                    hx-target="#dynamic-content"
                    hx-swap="innerHTML"
                    aria-label="Cancel emergency access request">
                Cancel
            </button>

            <!--Submit request-->
            <button type="submit" class="px-4 py-3 bg-red-600 hover:bg-red-700 text-white rounded-md transition duration-200 ease-in-out font-semibold">
                Grant Access
            </button>
        </div>
    </form>
</div>
