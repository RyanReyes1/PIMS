<div id="patient-{{ patient_id }}-{{ field_name }}-display" class="bg-gray-100 p-4 rounded-lg shadow-sm flex justify-between items-center">
    <div>
        <h4 class="text-sm font-medium text-gray-500">{{ label }}:</h4>
        {% if value is boolean %}
            <span class="text-lg font-semibold text-gray-800">{{ 'Yes' if value else 'No' }}</span>
        {% else %}
            <span class="text-lg font-semibold text-gray-800">{{ value if value else 'N/A' }}</span>
        {% endif %}
    </div>
    <button class="px-3 py-1 bg-red-500 hover:bg-red-600 text-white text-sm rounded-md"
            hx-get="{{ url_for('edit_patient_section', patient_id=patient_id, field_name=field_name) }}"
            hx-target="#patient-{{ patient_id }}-{{ field_name }}-display"
            hx-swap="outerHTML">
        Edit
    </button>
</div>
