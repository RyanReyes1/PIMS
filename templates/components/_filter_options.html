<div class="w-64 space-y-3">
    <h4 class="font-bold text-gray-800">Filter Options</h4>
    <div>
        <label for="search-location" class="block text-sm font-medium text-gray-700">Location:</label>
        <input type="text" id="search-location" name="location"
               class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
    </div>
    <div>
        <label for="search-approved-visitors" class="block text-sm font-medium text-gray-700">Approved Visitors:</label>
        <input type="text" id="search-approved-visitors" name="approved_visitors"
               class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
    </div>
    <div>
        <label for="search-identity" class="block text-sm font-medium text-gray-700">Identity:</label>
        <input type="text" id="search-identity" name="identity"
               class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
    </div>
    <div>
        <label for="search-insurance" class="block text-sm font-medium text-gray-700">Insurance:</label>
        <input type="text" id="search-insurance" name="insurance"
               class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
    </div>
    <div>
        <label for="search-billing" class="block text-sm font-medium text-gray-700">Billing:</label>
        <input type="text" id="search-billing" name="billing"
               class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
    </div>

    <div class="flex items-center">
        <input type="checkbox" id="filter-restricted-visitation" name="restricted_visitation" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
        <label for="filter-restricted-visitation" class="ml-2 block text-sm text-gray-900">Restricted Visitation</label>
    </div>
    <div class="flex items-center">
        <input type="checkbox" id="filter-full-chart" name="full_chart" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
        <label for="filter-full-chart" class="ml-2 block text-sm text-gray-900">Full Chart</label>
    </div>

    <button class="w-full px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md mt-4"
            hx-get="{{ url_for('search_patients') }}"
            hx-target="#search-results"
            hx-vals="js:{name: document.getElementById('search-name').value, location: document.getElementById('search-location').value, approved_visitors: document.getElementById('search-approved-visitors').value, identity: document.getElementById('search-identity').value, insurance: document.getElementById('search-insurance').value, billing: document.getElementById('search-billing').value, restricted_visitation: document.getElementById('filter-restricted-visitation').checked, full_chart: document.getElementById('filter-full-chart').checked}"
            onclick="document.getElementById('filter-options-dropdown').innerHTML = '';" {# Close dropdown on search #}>
        Apply Filters
    </button>
</div>
