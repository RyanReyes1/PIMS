<!--
Parent: base.html
Children: index.html

Layout for the website

Components:
*Header: Contains the IASO logo and the logout button
*Sidebar: Contains the patient search and registration buttons
*Main Content Area: Contains two subsections
    *Dynamic Content: This is where forms such as patient search, registration, and emergency access forms are loaded into
    *Patient Tabs: This is where the tab headers and the patient tab content are loaded into
-->
{% extends "base.html" %}

{% block content %}
<div class="flex h-screen overflow-hidden">
    <!-- Header -->
    {% include 'components/_header.html' %}

    <!-- Sidebar -->
    {% include 'components/_sidebar.html' %}

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col pt-16 ml-64 bg-white shadow-lg overflow-hidden">
        <div id="dashboard-main-content" class="flex-1 overflow-auto p-6">
            <!-- Initial content or message -->
            <h1 class="text-3xl font-bold text-gray-800 mb-6">Welcome to the Dashboard</h1>
            <p class="text-gray-600">Use the sidebar to manage patient records.</p>

            <!-- Dynamic content loaded by HTMX -->
            <div id="dynamic-content" class="mt-8">
                <!-- Content for search, register, emergency will load here -->
            </div>

            <!-- Patient Tabs Area -->
            <div id="patient-tabs-container" class="mt-8 border-t border-gray-200 pt-6">
                <div id="patient-tab-headers" class="flex flex-wrap border-b border-gray-300 -mb-px">
                    <!-- Tab headers will be appended here -->
                </div>
                <div id="patient-tab-content-area" class="bg-gray-50 p-4 border border-t-0 border-gray-300 rounded-b shadow-inner">
                    <!-- Tab content will be appended here -->
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
